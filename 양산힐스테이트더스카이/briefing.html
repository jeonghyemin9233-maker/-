<!doctype html>

<style>
@font-face { font-family: 'NSKR'; font-weight: 400; src: url('FONT_DIR/r.ttf'); }
@font-face { font-family: 'NSKR'; font-weight: 700; src: url('FONT_DIR/b.ttf'); }
@font-face { font-family: 'NSKR'; font-weight: 900; src: url('FONT_DIR/k.ttf'); }
:root {
  --navy: #0f2a44; --blue: #2466a8; --sky: #8fb3d9; --gold: #b07a1c; --gold-lt: #e9c77b;
  --ink: #1b2330; --ink2: #4a5566; --muted: #8a93a3; --line: #e3e6eb; --bg: #fcfcfb; --tint: #f1f4f8;
}
@page { size: 1280px 720px; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { word-break: keep-all; background: var(--bg); color: var(--ink); font-family: 'NSKR', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
svg text { font-family: inherit; }
.slide { width: 1280px; height: 720px; position: relative; overflow: hidden; page-break-after: always; background: var(--bg); }
.slide:last-child { page-break-after: auto; }
.hd { position: absolute; left: 64px; top: 44px; }
.eyebrow { font-size: 15px; font-weight: 700; letter-spacing: .12em; color: var(--gold); margin-bottom: 6px; }
h2 { font-size: 36px; font-weight: 900; letter-spacing: -0.02em; color: var(--navy); line-height: 1.2; }
.art { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
.foot { position: absolute; left: 64px; right: 64px; bottom: 18px; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
</style>
</head>
